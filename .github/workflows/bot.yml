name: 24-7 InternetAzad369 Cloud Bot

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'bot_licenses_state.json'
      - 'README.md'

concurrency:
  group: telegram-bot-cloud-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt Licenses Vault
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          python decrypt_vault.py

      - name: Run Telegram Bot
        id: bot
        env:
          MAX_RUN_SECONDS: 15600
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID || '748538264' }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER || '5057851044632500' }}
        run: |
          python telegram_bot.py

      - name: Commit and Push Database State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          if [ -f "bot_licenses_state.json" ]; then
            git add bot_licenses_state.json
            git commit -m "Auto-save bot database state [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push skipped or up to date"
          fi
