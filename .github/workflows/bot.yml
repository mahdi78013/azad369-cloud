name: 24-7 InternetAzad369 Cloud Bot

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'bot_licenses_state.json'
      - 'README.md'

concurrency:
  group: telegram-bot-cloud-runner
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt Licenses Vault
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          python decrypt_vault.py

      - name: Approve Pending Genuine Orders
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID || '748538264' }}
        run: |
          if [ -f "approve_orders.py" ]; then
            python approve_orders.py || true
          fi

      - name: Run Telegram Bot
        id: bot
        env:
          MAX_RUN_SECONDS: 15600
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID || '748538264' }}
          CARD_NUMBER: '5892101706458979'
        run: |
          python telegram_bot.py

      - name: Commit and Push Database State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          if [ -f "bot_licenses_state.json" ]; then
            git add bot_licenses_state.json hwid_registry.json historical_blacklist.json || true
            git commit -m "Auto-save bot database state [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push skipped or up to date"
          fi

      - name: Dispatch Next Relay Runner (Zero Downtime)
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
            -d '{"ref":"main"}' || echo "Self-relay dispatch passed"
